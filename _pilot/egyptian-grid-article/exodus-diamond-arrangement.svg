<svg width="680" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" style="background:transparent">
<style>
  text { font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .quad-a rect { fill: #E6F1FB; stroke: #185FA5; }
  .quad-a text.th { fill: #0C447C; }
  .quad-b rect { fill: #E1F5EE; stroke: #0F6E56; }
  .quad-b text.th { fill: #085041; }
  .quad-c rect { fill: #EEEDFE; stroke: #534AB7; }
  .quad-c text.th { fill: #3C3489; }
  .quad-d rect { fill: #FAECE7; stroke: #993C1D; }
  .quad-d text.th { fill: #712B13; }
  .pivot rect { fill: #FAEEDA; stroke: #854F0B; }
  .pivot text.th { fill: #633806; }
  .pivot text.ts { fill: #854F0B; }
  .leader { stroke: #B4B2A9; stroke-width: 0.5; stroke-dasharray: 4 3; fill: none; }
  .diamond { stroke: #B4B2A9; stroke-width: 0.5; stroke-dasharray: 4 3; fill: none; }
  .label { fill: #888780; }
</style>

<!-- TITLE -->
<text class="th" x="340" y="30" text-anchor="middle" dominant-baseline="central" fill="#3d3d3a">Exodus — diamond quad arrangement</text>

<!-- QUAD A diamond outline -->
<path class="diamond" d="M80,160 L150,90 L220,160 L150,230 Z"/>
<text class="ts label" x="150" y="153" text-anchor="middle" dominant-baseline="central" opacity="0.6">Quad A</text>
<text class="ts label" x="150" y="168" text-anchor="middle" dominant-baseline="central" opacity="0.45">Ox</text>

<!-- Quad A units -->
<g class="quad-a">
  <rect x="52" y="144" width="56" height="32" rx="6" stroke-width="0.5"/>
  <text class="th" x="80" y="160" text-anchor="middle" dominant-baseline="central">1</text>
</g>
<g class="quad-a">
  <rect x="122" y="74" width="56" height="32" rx="6" stroke-width="0.5"/>
  <text class="th" x="150" y="90" text-anchor="middle" dominant-baseline="central">2</text>
</g>
<g class="quad-a">
  <rect x="192" y="144" width="56" height="32" rx="6" stroke-width="0.5"/>
  <text class="th" x="220" y="160" text-anchor="middle" dominant-baseline="central">3</text>
</g>
<g class="quad-a">
  <rect x="122" y="214" width="56" height="32" rx="6" stroke-width="0.5"/>
  <text class="th" x="150" y="230" text-anchor="middle" dominant-baseline="central">4</text>
</g>

<!-- UNIT 5 pivot -->
<g class="pivot">
  <rect x="312" y="144" width="56" height="32" rx="6" stroke-width="0.5"/>
  <text class="th" x="340" y="156" text-anchor="middle" dominant-baseline="central">5</text>
  <text class="ts" x="340" y="170" text-anchor="middle" dominant-baseline="central">pivot</text>
</g>

<!-- QUAD B diamond outline -->
<path class="diamond" d="M460,160 L530,90 L600,160 L530,230 Z"/>
<text class="ts label" x="530" y="153" text-anchor="middle" dominant-baseline="central" opacity="0.6">Quad B</text>
<text class="ts label" x="530" y="168" text-anchor="middle" dominant-baseline="central" opacity="0.45">Man</text>

<!-- Quad B units -->
<g class="quad-b">
  <rect x="432" y="144" width="56" height="32" rx="6" stroke-width="0.5"/>
  <text class="th" x="460" y="160" text-anchor="middle" dominant-baseline="central">6</text>
</g>
<g class="quad-b">
  <rect x="502" y="74" width="56" height="32" rx="6" stroke-width="0.5"/>
  <text class="th" x="530" y="90" text-anchor="middle" dominant-baseline="central">7</text>
</g>
<g class="quad-b">
  <rect x="572" y="144" width="56" height="32" rx="6" stroke-width="0.5"/>
  <text class="th" x="600" y="160" text-anchor="middle" dominant-baseline="central">8</text>
</g>
<g class="quad-b">
  <rect x="502" y="214" width="56" height="32" rx="6" stroke-width="0.5"/>
  <text class="th" x="530" y="230" text-anchor="middle" dominant-baseline="central">9</text>
</g>

<!-- UNIT 10 center pivot -->
<g class="pivot">
  <rect x="312" y="294" width="56" height="32" rx="6" stroke-width="0.5"/>
  <text class="th" x="340" y="306" text-anchor="middle" dominant-baseline="central">10</text>
  <text class="ts" x="340" y="320" text-anchor="middle" dominant-baseline="central">pivot</text>
</g>

<!-- QUAD C diamond outline -->
<path class="diamond" d="M80,470 L150,400 L220,470 L150,540 Z"/>
<text class="ts label" x="150" y="463" text-anchor="middle" dominant-baseline="central" opacity="0.6">Quad C</text>
<text class="ts label" x="150" y="478" text-anchor="middle" dominant-baseline="central" opacity="0.45">Eagle</text>

<!-- Quad C units -->
<g class="quad-c">
  <rect x="52" y="454" width="56" height="32" rx="6" stroke-width="0.5"/>
  <text class="th" x="80" y="470" text-anchor="middle" dominant-baseline="central">11</text>
</g>
<g class="quad-c">
  <rect x="122" y="384" width="56" height="32" rx="6" stroke-width="0.5"/>
  <text class="th" x="150" y="400" text-anchor="middle" dominant-baseline="central">12</text>
</g>
<g class="quad-c">
  <rect x="192" y="454" width="56" height="32" rx="6" stroke-width="0.5"/>
  <text class="th" x="220" y="470" text-anchor="middle" dominant-baseline="central">13</text>
</g>
<g class="quad-c">
  <rect x="122" y="524" width="56" height="32" rx="6" stroke-width="0.5"/>
  <text class="th" x="150" y="540" text-anchor="middle" dominant-baseline="central">14</text>
</g>

<!-- UNIT 15 pivot -->
<g class="pivot">
  <rect x="312" y="454" width="56" height="32" rx="6" stroke-width="0.5"/>
  <text class="th" x="340" y="466" text-anchor="middle" dominant-baseline="central">15</text>
  <text class="ts" x="340" y="480" text-anchor="middle" dominant-baseline="central">pivot</text>
</g>

<!-- QUAD D diamond outline -->
<path class="diamond" d="M460,470 L530,400 L600,470 L530,540 Z"/>
<text class="ts label" x="530" y="463" text-anchor="middle" dominant-baseline="central" opacity="0.6">Quad D</text>
<text class="ts label" x="530" y="478" text-anchor="middle" dominant-baseline="central" opacity="0.45">Lion</text>

<!-- Quad D units -->
<g class="quad-d">
  <rect x="432" y="454" width="56" height="32" rx="6" stroke-width="0.5"/>
  <text class="th" x="460" y="470" text-anchor="middle" dominant-baseline="central">16</text>
</g>
<g class="quad-d">
  <rect x="502" y="384" width="56" height="32" rx="6" stroke-width="0.5"/>
  <text class="th" x="530" y="400" text-anchor="middle" dominant-baseline="central">17</text>
</g>
<g class="quad-d">
  <rect x="572" y="454" width="56" height="32" rx="6" stroke-width="0.5"/>
  <text class="th" x="600" y="470" text-anchor="middle" dominant-baseline="central">18</text>
</g>
<g class="quad-d">
  <rect x="502" y="524" width="56" height="32" rx="6" stroke-width="0.5"/>
  <text class="th" x="530" y="540" text-anchor="middle" dominant-baseline="central">19</text>
</g>

<!-- Connecting lines from pivots -->
<line class="leader" x1="248" y1="160" x2="312" y2="160"/>
<line class="leader" x1="368" y1="160" x2="432" y2="160"/>
<line class="leader" x1="340" y1="246" x2="340" y2="294"/>
<line class="leader" x1="340" y1="326" x2="340" y2="384"/>
<line class="leader" x1="248" y1="470" x2="312" y2="470"/>
<line class="leader" x1="368" y1="470" x2="432" y2="470"/>
<line class="leader" x1="150" y1="246" x2="150" y2="384"/>
<line class="leader" x1="530" y1="246" x2="530" y2="384"/>

<!-- Legend -->
<text class="ts" x="40" y="590" dominant-baseline="central" fill="#5F5E5A">Diamond positions: left = 1st, top = 2nd, right = 3rd, bottom = 4th in each quad</text>
<text class="ts" x="40" y="607" dominant-baseline="central" fill="#888780">Three pivot units (5, 10, 15) on center axis</text>
</svg>
