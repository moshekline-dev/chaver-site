name: Update sitemap lastmod dates

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'Auto-update sitemap')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for git log dates

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update sitemap lastmod dates
        run: python .github/scripts/sitemap_lastmod.py --inplace

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet sitemap.xml; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated sitemap
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Auto-update sitemap lastmod dates"
          git push
